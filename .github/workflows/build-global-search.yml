name: Build Revenge Next plugins

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "plugins/**"
      - "package.json"
      - "tsconfig.json"
      - "bun.lock"
      - ".github/workflows/build-global-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint:types
        continue-on-error: true

      - name: Build plugins
        run: bun run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revenge-plugins
          path: |
            plugins/*/build/
            plugins/*/manifest.json
