name: Build Global Search

on:
  push:
    branches:
      - main
      - "fix/**"
    paths-ignore:
      - "GlobalSearch/index.js"
      - "GlobalSearch/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Commit generated plugin
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GlobalSearch/index.js GlobalSearch/manifest.json
          git commit -m "build(GlobalSearch): generate distributable plugin"
          git push
